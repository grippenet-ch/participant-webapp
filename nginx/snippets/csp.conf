# Country Content-Security-Policy directives (owned by this repo, never touched by copier update).
# One directive per line. Only the policy lives here: security-headers.conf (template) sends
# the header and appends upgrade-insecure-requests for https clients.
#
# Baseline: app + reCAPTCHA. Add the country's third parties (cookie banner, analytics,
# blog, embedded dashboards) and check every page in a browser for "Refused to ..." errors.

set $csp "default-src 'self'";
set $csp "${csp}; base-uri 'self'";
set $csp "${csp}; object-src 'none'";
set $csp "${csp}; frame-ancestors 'none'";
set $csp "${csp}; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/";
set $csp "${csp}; style-src 'self' 'unsafe-inline' https://www.gstatic.com/recaptcha/";
set $csp "${csp}; img-src 'self' data: https:";
set $csp "${csp}; font-src 'self' data:";
# storage.googleapis.com/grippenetch-results/: Grippenet_incidence.html, iframed by the results page (markdowns/results_template.md)
set $csp "${csp}; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://storage.googleapis.com/grippenetch-results/";
set $csp "${csp}; connect-src 'self' https://www.google.com/recaptcha/";
